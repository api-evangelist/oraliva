description: OraLiva, Inc. is a dental diagnostics company developing an AI-powered
  oral cancer and dysplasia detection system for use during routine dental visits.
  Its ONC In-Cyt platform pairs a minimally-invasive brush biopsy with deep-learning
  cytology trained on more than 13 million cell images to score early malignancy risk.
  The company emerged from NIH-funded research at NYU by Dr. John T. McDevitt and is
  a portfolio company of DCVC. It is a medical-diagnostics (medtech/healthtech) company
  with no public developer, API, or technical surface at this time.
